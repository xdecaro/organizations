name: Normalize Organizations 0.3.0 lowercase vendor

on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowercase-vendor-0.3.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lowercase-vendor-0.3.0
          fetch-depth: 0
      - name: Normalize
        run: python3 tools/lowercase_vendor_0_3.py
      - name: Validate
        run: |
          set -euo pipefail
          find component package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('.').rglob('*.xml'):
              if '.git' not in p.parts and '.github' not in p.parts: ET.parse(p)
          PY
          test "$(cat VERSION)" = '0.3.0'
          grep -Fq 'xdecaro\Component\Organizations' component/xdecaroorganizations.xml
          ! grep -RIn 'Xdecaro\\' component package build tests updates README.md
      - name: Commit branch
        run: |
          set -euo pipefail
          rm tools/lowercase_vendor_0_3.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize Organizations 0.3.0 vendor namespace to lowercase xdecaro'
          git push origin HEAD:lowercase-vendor-0.3.0
