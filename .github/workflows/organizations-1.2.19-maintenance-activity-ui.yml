name: Organizations 1.2.19 maintenance activity UI
on:
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', coverage: none}
      - run: php tests/organizations-1.2.19-maintenance-activity-ui-contract.php
