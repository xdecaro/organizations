name: Organizations 1.3.0 Global Admin Views

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Run 1.3.0 global admin view contracts
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/global-admin-menu-contract.php
            tests/global-admin-readonly-responsive-contract.php
            tests/global-affiliations-model-contract.php
            tests/global-affiliations-ui-contract.php
            tests/global-appointments-model-contract.php
            tests/global-appointments-ui-contract.php
            tests/global-delegations-model-contract.php
            tests/global-delegations-ui-contract.php
            tests/global-hierarchy-model-contract.php
            tests/global-hierarchy-ui-contract.php
            tests/global-bodies-model-contract.php
            tests/global-bodies-ui-contract.php
            tests/organizations-1.3.0-global-admin-views-contract.php
          )
          for test_file in "${tests[@]}"; do
            if [[ -f "$test_file" ]]; then
              echo "==> $test_file"
              php "$test_file"
            fi
          done
