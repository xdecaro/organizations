name: Organizations 1.3.3 Affiliations Filter UX

on:
  pull_request:
  push:
    branches: [main, fix/1.3.3-affiliations-filter-ux]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
      - name: PHP syntax
        run: php -l tests/organizations-1.3.3-affiliations-filter-ux-contract.php
      - name: Run 1.3.3 affiliations filter UX contract
        run: php tests/organizations-1.3.3-affiliations-filter-ux-contract.php
