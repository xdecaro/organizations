name: Release Organizations
on:
  push:
    branches: [main]
    paths: [VERSION]
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', coverage: none}
      - name: Build stable release
        run: |
          set -euo pipefail; V="$(cat VERSION)"; test -n "$V"; find component package tests -type f -name '*.php' -print0|xargs -0 -n1 php -l; php tests/core-integration-smoke.php; php tests/joomla6-listmodel-contract.php; php tests/form-controller-option-contract.php; php tests/form-validation-contract.php; php tests/trashed-filter-contract.php; php tests/information-version-contract.php; php tests/state-actions-contract.php; php tests/admin-ux-duplicates-contract.php; php tests/no-delete-toolbar-contract.php; php tests/parent-self-option-contract.php; php tests/edit-name-heading-contract.php; php tests/contacts-ux-contract.php; php tests/hierarchy-list-contract.php; php tests/appointments-schema-contract.php; php tests/appointments-domain.php; php tests/appointments-people-contract.php; php tests/appointments-backend-contract.php; php tests/appointments-ui-contract.php; chmod +x build/build.sh; build/build.sh; cp dist/SHA256SUMS.txt /tmp/sums; build/build.sh; diff -u /tmp/sums dist/SHA256SUMS.txt
      - name: Refuse existing release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: if gh release view "v$(cat VERSION)" >/dev/null 2>&1; then exit 1; fi
      - name: Publish release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          V="$(cat VERSION)"; gh release create "v${V}" dist/com_xdecaroorganizations_${V}.zip dist/pkg_xdecaroorganizations_${V}.zip dist/SHA256SUMS.txt --title "Organizations ${V}" --notes "Organizations ${V}: adds permanent deletion of a single active appointment from Members with explicit confirmation, ACL/CSRF checks, and server-side protection that prevents deleting historical appointments. Deleting one appointment does not affect other appointments for the same person. Joomla 6.1.x only."
      - name: Publish update metadata and checksum
        run: |
          V="$(cat VERSION)"; SHA="$(sha256sum "dist/pkg_xdecaroorganizations_${V}.zip"|awk '{print $1}')"; python3 - "$V" "$SHA" <<'PY'
          import sys,xml.etree.ElementTree as ET
          version, sha = sys.argv[1], sys.argv[2]
          p='updates/pkg_xdecaroorganizations.xml'; t=ET.parse(p); u=t.getroot().find('./update')
          u.find('version').text=version
          u.find('./downloads/downloadurl').text=f'https://github.com/xdecaro/organizations/releases/download/v{version}/pkg_xdecaroorganizations_{version}.zip'
          u.find('sha256').text=sha
          ET.indent(t,space='  '); t.write(p,encoding='utf-8',xml_declaration=True)
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add updates/pkg_xdecaroorganizations.xml; git diff --cached --quiet || git commit -m "Publish Organizations ${V} update metadata"; git pull --rebase origin main; git push origin HEAD:main
