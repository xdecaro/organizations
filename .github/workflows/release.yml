name: Release Organizations
on:
  push:
    branches: [main]
    paths: [VERSION]
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', coverage: none}
      - name: Validate stable source
        shell: bash
        run: |
          set -euo pipefail
          V="$(cat VERSION)"
          test -n "$V"
          find component package tests -type f -name '*.php' -print0|xargs -0 -n1 php -l
          php tests/core-integration-smoke.php
          php tests/joomla6-listmodel-contract.php
          php tests/form-controller-option-contract.php
          php tests/form-validation-contract.php
          php tests/trashed-filter-contract.php
          php tests/information-version-contract.php
          php tests/dashboard-information-1.2.15-contract.php
          php tests/dashboard-information-1.2.16-polish-contract.php
          php tests/organizations-1.2.17-database-maintenance-contract.php
          php tests/organizations-1.2.18-maintenance-polish-contract.php
          php tests/organizations-1.2.19-maintenance-activity-ui-contract.php
          php tests/organizations-1.2.20-maintenance-mobile-details-contract.php
          php tests/organizations-1.2.21-maintenance-mobile-details-card-contract.php
          php tests/organizations-1.2.22-maintenance-desktop-details-contract.php
          php tests/organizations-1.2.23-maintenance-desktop-details-alignment-contract.php
          php tests/state-actions-contract.php
          php tests/admin-ux-duplicates-contract.php
          php tests/no-delete-toolbar-contract.php
          php tests/parent-self-option-contract.php
          php tests/edit-name-heading-contract.php
          php tests/contacts-ux-contract.php
          php tests/public-country-code-provider-contract.php
          php tests/hierarchy-list-contract.php
          php tests/appointments-schema-contract.php
          php tests/appointments-domain.php
          php tests/appointments-people-contract.php
          php tests/appointments-people-disambiguation-contract.php
          php tests/appointments-backend-contract.php
          php tests/appointments-ui-contract.php
          php tests/members-tab-persistence-contract.php
          php tests/organizations-1.0.26-canonical-package-contract.php
          php tests/person-appointments-provider-contract.php
          php tests/affiliations-contract.php
          php tests/organizations-list-columns-contract.php
          php tests/affiliation-direction-contract.php
          php tests/global-admin-menu-contract.php
          php tests/global-admin-readonly-responsive-contract.php
          php tests/global-affiliations-model-contract.php
          php tests/global-affiliations-ui-contract.php
          php tests/global-appointments-model-contract.php
          php tests/global-appointments-ui-contract.php
          php tests/global-delegations-model-contract.php
          php tests/global-delegations-ui-contract.php
          php tests/global-hierarchy-model-contract.php
          php tests/global-hierarchy-ui-contract.php
          php tests/global-bodies-model-contract.php
          php tests/global-bodies-ui-contract.php
          php tests/organizations-1.3.0-global-admin-views-contract.php
          php tests/organizations-1.3.1-global-admin-polish-contract.php
      - name: Build deterministic release
        shell: bash
        run: |
          set -euo pipefail
          V="$(cat VERSION)"
          chmod +x build/build.sh
          build/build.sh
          cp dist/SHA256SUMS.txt /tmp/sums
          build/build.sh
          diff -u /tmp/sums dist/SHA256SUMS.txt
          unzip -t "dist/com_xdecaroorganizations_${V}.zip" >/dev/null
          unzip -t "dist/pkg_organizations_${V}.zip" >/dev/null
          unzip -Z1 "dist/pkg_organizations_${V}.zip" | grep -Fxq 'pkg_organizations.xml'
          unzip -p "dist/pkg_organizations_${V}.zip" com_xdecaroorganizations.zip > /tmp/component.zip
          unzip -p /tmp/component.zip admin/src/Service/PeopleIntegrationService.php | grep -Fq 'searchPeopleForIdentity'
          unzip -p /tmp/component.zip admin/src/Service/PersonAppointmentsService.php | grep -Fq 'getAppointmentsByPersonUuid'
          unzip -p /tmp/component.zip admin/src/Service/BackupService.php | grep -Fq 'xdecaro.organizations.backup'
          unzip -p /tmp/component.zip admin/src/Service/DatabaseMaintenanceService.php | grep -Fq 'FUNCTIONAL_TABLES'
          unzip -p /tmp/component.zip admin/src/Service/MaintenanceLogService.php | grep -Fq 'actor_name'
          unzip -p /tmp/component.zip admin/tmpl/maintenance/default.php | grep -Fq 'xdecaro-activity-table'
          unzip -p /tmp/component.zip media/css/maintenance.css | grep -Fq 'td.xdecaro-activity-details-cell::before'
          unzip -p /tmp/component.zip media/css/maintenance.css | grep -Fq 'display: block !important'
          unzip -p /tmp/component.zip media/css/maintenance.css | grep -Fq '.xdecaro-activity-details > summary'
          unzip -p /tmp/component.zip media/css/maintenance.css | grep -Fq '@media (min-width: 768px)'
          unzip -p /tmp/component.zip media/css/maintenance.css | grep -Fq 'border: 0 !important'
          unzip -p /tmp/component.zip media/css/maintenance.css | grep -Fq 'background: transparent !important'
          unzip -p /tmp/component.zip media/css/maintenance.css | grep -Fq 'vertical-align: middle !important'
          unzip -p /tmp/component.zip media/css/maintenance.css | grep -Fq 'text-align: right !important'
          unzip -p /tmp/component.zip media/css/maintenance.css | grep -Fq 'margin: 0 !important'
          for path in admin/src/Model/AffiliationsModel.php admin/src/Model/AppointmentsModel.php admin/src/Model/DelegationsModel.php admin/src/Model/HierarchyModel.php admin/src/Model/BodiesModel.php admin/tmpl/affiliations/default.php admin/tmpl/appointments/default.php admin/tmpl/delegations/default.php admin/tmpl/hierarchy/default.php admin/tmpl/bodies/default.php media/css/global-lists.css; do
            unzip -Z1 /tmp/component.zip | grep -Fxq "$path"
          done
      - name: Refuse existing release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: if gh release view "v$(cat VERSION)" >/dev/null 2>&1; then exit 1; fi
      - name: Publish release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        shell: bash
        run: |
          set -euo pipefail
          V="$(cat VERSION)"
          gh release create "v${V}" \
            "dist/com_xdecaroorganizations_${V}.zip" \
            "dist/pkg_organizations_${V}.zip" \
            dist/SHA256SUMS.txt \
            --title "Organizations ${V}" \
            --notes "Organizations ${V}: rifinitura delle cinque viste amministrative globali. Corregge le chiavi lingua visibili, traduce tipi/livelli/stati, uniforma i badge di stato e mostra le date nel formato dd/mm/yyyy, senza modifiche al database o alla logica delle relazioni. Joomla 6 only."
      - name: Publish canonical and legacy-bridge Joomla update metadata
        shell: bash
        run: |
          set -euo pipefail
          V="$(cat VERSION)"
          SHA="$(sha256sum "dist/pkg_organizations_${V}.zip"|awk '{print $1}')"
          python3 - "$V" "$SHA" <<'PY'
          import sys,xml.etree.ElementTree as ET
          version, sha = sys.argv[1], sys.argv[2]
          url=f'https://github.com/xdecaro/organizations/releases/download/v{version}/pkg_organizations_{version}.zip'
          for path, element in [
              ('updates/pkg_organizations.xml', 'pkg_organizations'),
              ('updates/pkg_xdecaroorganizations.xml', 'pkg_xdecaroorganizations'),
          ]:
              t=ET.parse(path); u=t.getroot().find('./update')
              u.find('name').text='Organizations'
              u.find('element').text=element
              u.find('version').text=version
              u.find('./downloads/downloadurl').text=url
              u.find('sha256').text=sha
              ET.indent(t,space='  '); t.write(path,encoding='utf-8',xml_declaration=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/pkg_organizations.xml updates/pkg_xdecaroorganizations.xml
          git diff --cached --quiet || git commit -m "Publish Organizations ${V} update metadata"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify published updater resources
        shell: bash
        run: |
          set -euo pipefail
          V="$(cat VERSION)"
          EXPECTED_SHA="$(sha256sum "dist/pkg_organizations_${V}.zip"|awk '{print $1}')"
          for FEED in pkg_organizations pkg_xdecaroorganizations; do
            for attempt in 1 2 3 4 5; do
              curl -fsSL "https://raw.githubusercontent.com/xdecaro/organizations/main/updates/${FEED}.xml?run=${GITHUB_RUN_ID}-${attempt}" -o "/tmp/${FEED}.xml" || true
              if grep -Fq "<version>${V}</version>" "/tmp/${FEED}.xml" 2>/dev/null; then break; fi
              sleep 3
            done
            grep -Fq "releases/download/v${V}/pkg_organizations_${V}.zip" "/tmp/${FEED}.xml"
            grep -Fq "<sha256>${EXPECTED_SHA}</sha256>" "/tmp/${FEED}.xml"
          done
          grep -Fq '<element>pkg_organizations</element>' /tmp/pkg_organizations.xml
          grep -Fq '<element>pkg_xdecaroorganizations</element>' /tmp/pkg_xdecaroorganizations.xml
          curl -fL --retry 3 "https://github.com/xdecaro/organizations/releases/download/v${V}/pkg_organizations_${V}.zip" -o /tmp/published-package.zip
          echo "${EXPECTED_SHA}  /tmp/published-package.zip" | sha256sum --check --strict
          unzip -t /tmp/published-package.zip >/dev/null
