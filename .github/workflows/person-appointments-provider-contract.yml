name: Organizations person appointments contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: php -l tests/person-appointments-provider-contract.php
      - name: Person appointments provider contract
        run: php tests/person-appointments-provider-contract.php
