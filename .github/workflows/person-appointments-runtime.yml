name: Organizations person appointments runtime

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: joomla
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: 'mysqli, zip, simplexml'
          coverage: none
      - name: Build current Organizations
        run: chmod +x build/build.sh && build/build.sh
      - name: Download verified Joomla and Core
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/joomla/joomla-cms/releases/download/6.1.3/Joomla_6.1.3-Stable-Full_Package.zip' -o /tmp/joomla.zip
          echo 'a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1  /tmp/joomla.zip' | sha256sum --check --strict
          curl -fL --retry 3 'https://github.com/xdecaro/core/releases/download/v1.4.0/pkg_xdecarocore_1.4.0.zip' -o /tmp/core.zip
          echo '4248f7e3de514c2ae2402ffc8ba12845647dca1ebac963da370650e88ac45def  /tmp/core.zip' | sha256sum --check --strict
          mkdir joomla
          unzip -q /tmp/joomla.zip -d joomla
      - name: Install stack
        shell: bash
        run: |
          set -euo pipefail
          V="$(tr -d '\r\n' < VERSION)"
          cd joomla
          php installation/joomla.php install \
            --site-name='Organizations Person Appointments CI' \
            --admin-user='Integration Admin' \
            --admin-username=admin \
            --admin-password="OrganizationsPersonAppointments-${GITHUB_RUN_ID}!" \
            --admin-email=admin@example.invalid \
            --db-type=mysqli \
            --db-host=127.0.0.1 \
            --db-user=root \
            --db-pass='' \
            --db-name=joomla \
            --db-prefix=org_ \
            --db-encryption=0 \
            --no-interaction
          php cli/joomla.php extension:install --path=/tmp/core.zip -vvv
          php cli/joomla.php extension:install --path="$GITHUB_WORKSPACE/dist/pkg_organizations_${V}.zip" -vvv
      - name: Probe public person appointments service
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          cat > person-appointments-runtime-probe.php <<'PHP'
          <?php
          $_SERVER['HTTP_HOST'] = 'localhost';
          define('_JEXEC', 1);
          define('JPATH_BASE', __DIR__);
          require JPATH_BASE . '/includes/defines.php';
          require JPATH_BASE . '/includes/framework.php';

          $container = \Joomla\CMS\Factory::getContainer();
          $container->alias('session', 'session.cli')
              ->alias('JSession', 'session.cli')
              ->alias(\Joomla\CMS\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\SessionInterface::class, 'session.cli');
          $app = $container->get('JApplicationAdministrator');
          \Joomla\CMS\Factory::$application = $app;
          $app->createExtensionNamespaceMap();
          $db = $container->get(\Joomla\Database\DatabaseInterface::class);

          $query = $db->getQuery(true)
              ->select($db->quoteName('id'))
              ->from($db->quoteName('#__users'))
              ->where($db->quoteName('username') . ' = ' . $db->quote('admin'));
          $adminId = (int) $db->setQuery($query, 0, 1)->loadResult();
          $userFactory = $container->get(\Joomla\CMS\User\UserFactoryInterface::class);
          $app->loadIdentity($userFactory->loadUserById($adminId));

          $organization = (object) [
              'uuid' => '11111111-2222-4333-8444-555555555555',
              'name' => 'Runtime Organization',
              'type' => 'organization',
              'state' => 1,
              'access' => 1,
              'created' => \Joomla\CMS\Factory::getDate()->toSql(),
              'created_by' => $adminId,
          ];
          $db->insertObject('#__xdecaroorganizations_organizations', $organization, 'id');
          $organizationId = (int) $organization->id;

          $personUuid = 'aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee';
          $otherPersonUuid = 'bbbbbbbb-cccc-4ddd-8eee-ffffffffffff';

          $fixtures = [
              (object) [
                  'uuid' => '10000000-0000-4000-8000-000000000001',
                  'organization_id' => $organizationId,
                  'person_uuid' => $personUuid,
                  'person_name_snapshot' => 'Runtime Person',
                  'role_code' => 'councillor',
                  'starts_on' => '2026-09-14',
                  'planned_ends_on' => '2027-09-17',
                  'state' => 1,
                  'created' => \Joomla\CMS\Factory::getDate()->toSql(),
                  'created_by' => $adminId,
              ],
              (object) [
                  'uuid' => '10000000-0000-4000-8000-000000000002',
                  'organization_id' => $organizationId,
                  'person_uuid' => $personUuid,
                  'person_name_snapshot' => 'Runtime Person',
                  'role_code' => 'secretary',
                  'starts_on' => '2024-01-01',
                  'planned_ends_on' => '2025-01-01',
                  'ended_on' => '2025-01-01',
                  'end_reason' => 'term_end',
                  'state' => 1,
                  'created' => \Joomla\CMS\Factory::getDate()->toSql(),
                  'created_by' => $adminId,
              ],
              (object) [
                  'uuid' => '10000000-0000-4000-8000-000000000003',
                  'organization_id' => $organizationId,
                  'person_uuid' => $otherPersonUuid,
                  'person_name_snapshot' => 'Other Person',
                  'role_code' => 'president',
                  'starts_on' => '2026-01-01',
                  'planned_ends_on' => '2027-01-01',
                  'state' => 1,
                  'created' => \Joomla\CMS\Factory::getDate()->toSql(),
                  'created_by' => $adminId,
              ],
          ];

          foreach ($fixtures as $fixture) {
              $db->insertObject('#__xdecaroorganizations_appointments', $fixture, 'id');
          }

          $component = $app->bootComponent('com_xdecaroorganizations');
          if (!method_exists($component, 'getPersonAppointmentsService')) {
              fwrite(STDERR, "Organizations public person appointments accessor is unavailable.\n");
              exit(1);
          }

          $rows = $component->getPersonAppointmentsService()->getAppointmentsByPersonUuid($personUuid);
          if (count($rows) !== 2) {
              fwrite(STDERR, 'Expected exactly two appointments, got ' . count($rows) . "\n");
              exit(1);
          }

          $expectedKeys = [
              'appointment_id', 'appointment_uuid', 'organization_id', 'organization_uuid',
              'organization_name', 'role_code', 'role_custom', 'role_label_key', 'starts_on',
              'planned_ends_on', 'ended_on', 'end_reason', 'visual_status', 'is_current',
          ];
          sort($expectedKeys);

          $current = null;
          $history = null;
          foreach ($rows as $row) {
              $keys = array_keys($row);
              sort($keys);
              if ($keys !== $expectedKeys) {
                  fwrite(STDERR, 'Unexpected public field set: ' . json_encode($keys) . "\n");
                  exit(1);
              }
              if (!empty($row['is_current'])) {
                  $current = $row;
              } else {
                  $history = $row;
              }
          }

          if (($current['visual_status'] ?? '') !== 'active' || ($current['role_code'] ?? '') !== 'councillor') {
              fwrite(STDERR, "Current appointment classification is incorrect.\n");
              exit(1);
          }
          if (($history['visual_status'] ?? '') !== 'ended' || ($history['role_code'] ?? '') !== 'secretary') {
              fwrite(STDERR, "Historical appointment classification is incorrect.\n");
              exit(1);
          }
          if ($component->getPersonAppointmentsService()->getAppointmentsByPersonUuid('invalid-uuid') !== []) {
              fwrite(STDERR, "Invalid UUID must return an empty result.\n");
              exit(1);
          }

          echo "Organizations person appointments runtime OK\n";
          PHP
          php person-appointments-runtime-probe.php
